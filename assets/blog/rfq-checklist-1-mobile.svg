<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-label="Four details to send with a Chinese vehicle parts RFQ"><rect width="420" height="1080" rx="16" fill="#edf3f8"/><text x="22" y="42" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">Four details to send</text><text x="22" y="72" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">with the enquiry</text><rect x="20" y="98" width="380" height="210" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="136" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">1 · Brand</text><text x="38" y="172" font-family="Arial" font-size="17" fill="#223c50">Vehicle brand &amp; model variant</text><text x="38" y="202" font-family="Arial" font-size="17" fill="#223c50">Production year / VIN details</text><text x="38" y="232" font-family="Arial" font-size="17" fill="#223c50">Not the sales name alone</text><rect x="20" y="322" width="380" height="210" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="360" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">2 · Reference</text><text x="38" y="396" font-family="Arial" font-size="17" fill="#223c50">Complete OE reference</text><text x="38" y="426" font-family="Arial" font-size="17" fill="#223c50">Keep every suffix</text><text x="38" y="456" font-family="Arial" font-size="17" fill="#223c50">Keep both if two are listed</text><rect x="20" y="546" width="380" height="210" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="584" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">3 · Quantity</text><text x="38" y="620" font-family="Arial" font-size="17" fill="#223c50">Required quantity &amp; unit</text><text x="38" y="650" font-family="Arial" font-size="17" fill="#223c50">Alternatives in a separate field</text><rect x="20" y="770" width="380" height="210" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="808" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">4 · Destination</text><text x="38" y="844" font-family="Arial" font-size="17" fill="#223c50">Country / destination port</text><text x="38" y="874" font-family="Arial" font-size="17" fill="#223c50">Part-label photo if uncertain</text><text x="22" y="1030" font-family="Arial" font-size="15" fill="#536b7b">A catalogue result is not fitment or stock confirmation.</text></svg>
