<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900" role="img" aria-label="Keep market name with year and powertrain"><rect width="420" height="900" rx="20" fill="#edf3f8"/><text x="26" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">Keep market name with</text><text x="26" y="80" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">year and powertrain</text><rect x="24" y="100" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="138" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">Market name</text><text x="42" y="174" font-family="Arial" font-size="17" fill="#223c50">As on vehicle papers</text><text x="42" y="206" font-family="Arial" font-size="17" fill="#223c50">Not a compatibility proof</text><text x="42" y="238" font-family="Arial" font-size="17" fill="#223c50">Keep buyer&#x27;s wording</text><rect x="24" y="360" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="398" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">Production year</text><text x="42" y="434" font-family="Arial" font-size="17" fill="#223c50">Model year</text><text x="42" y="466" font-family="Arial" font-size="17" fill="#223c50">Build date if known</text><text x="42" y="498" font-family="Arial" font-size="17" fill="#223c50">Market-specific differences</text><rect x="24" y="620" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="658" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">Powertrain</text><text x="42" y="694" font-family="Arial" font-size="17" fill="#223c50">Engine / transmission</text><text x="42" y="726" font-family="Arial" font-size="17" fill="#223c50">Variant details</text><text x="42" y="758" font-family="Arial" font-size="17" fill="#223c50">Record with the name</text><text x="26" y="888" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram