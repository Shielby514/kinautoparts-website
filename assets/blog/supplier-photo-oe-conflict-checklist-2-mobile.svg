<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img"><rect width="420" height="1010" rx="16" fill="#edf3f8"/><text x="22" y="35" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">Check that the photographs</text><text x="22" y="63" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">belong together</text><rect x="20" y="125" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="167" font-family="Arial" font-size="22" fill="#076c79">View A</text><text x="40" y="210" font-family="Arial" font-size="20" fill="#076c79">Complete component</text><text x="40" y="253" font-family="Arial" font-size="20" fill="#076c79">Connector and mounts</text><text x="40" y="296" font-family="Arial" font-size="20" fill="#076c79">Same visible features</text><rect x="20" y="370" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="412" font-family="Arial" font-size="22" fill="#076c79">View B</text><text x="40" y="455" font-family="Arial" font-size="20" fill="#076c79">Readable identification</text><text x="40" y="498" font-family="Arial" font-size="20" fill="#076c79">Enough surrounding item</text><text x="40" y="541" font-family="Arial" font-size="20" fill="#076c79">No hidden substitution</text><rect x="20" y="615" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="657" font-family="Arial" font-size="22" fill="#076c79">Decision</text><text x="40" y="700" font-family="Arial" font-size="20" fill="#076c79">Consistent: keep evidence</text><text x="40" y="743" font-family="Arial" font-size="20" fill="#076c79">Different: flag conflict</text><text x="40" y="786" font-family="Arial" font-size="20" fill="#076c79">Unclear: request another</text><text x="22" y="905" font-family="Arial" font-size="19" fill="#344d60">A shared filename prefix cannot</text><text x="22" y="933" font-family="Arial" font-size="19" fill="#344d60">resolve a visible component</text><text x="22" y="961" font-family="Arial" font-size="19" fill="#344d60">mismatch.</text></svg>