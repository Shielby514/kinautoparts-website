<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="How to copy a complete part reference without losing identifiers"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Keep the complete reference</text><rect x="30" y="80" width="840" height="120" rx="12" fill="white" stroke="#9db7c7"/><text x="52" y="118" font-family="Arial" font-size="15" fill="#536b7b">COPIED FROM LABEL / PURCHASE RECORD</text><text x="52" y="165" font-family="Arial" font-size="34" font-weight="bold" fill="#17364c">39180 - 2B030</text><text x="360" y="165" font-family="Arial" font-size="16" fill="#076c79">prefix · letters · suffix · version</text><text x="360" y="190" font-family="Arial" font-size="15" fill="#536b7b">Drop no segment when copying</text><rect x="30" y="220" width="400" height="140" rx="12" fill="white" stroke="#9db7c7"/><text x="52" y="258" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Two numbers for one item?</text><text x="52" y="294" font-family="Arial" font-size="16" fill="#223c50">Keep both in the enquiry.</text><text x="52" y="322" font-family="Arial" font-size="16" fill="#223c50">Ask for identification review.</text><rect x="450" y="220" width="420" height="140" rx="12" fill="#fdeeee" stroke="#d99"/><text x="472" y="258" font-family="Arial" font-size="18" font-weight="bold" fill="#7b050f">Do not assume interchangeable</text><text x="472" y="294" font-family="Arial" font-size="16" fill="#223c50">Suffixes can change the version.</text><text x="472" y="322" font-family="Arial" font-size="16" fill="#223c50">Wait for confirmation first.</text></svg>
