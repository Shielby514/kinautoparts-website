<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1080" role="img" aria-label="What a quotation confirms and what a catalogue entry does not"><rect width="420" height="1080" rx="16" fill="#edf3f8"/><text x="22" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">What is actually</text><text x="22" y="74" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">confirmed?</text><rect x="20" y="100" width="380" height="400" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="140" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">In the quotation</text><text x="38" y="180" font-family="Arial" font-size="17" fill="#223c50">Proposed item &amp; basis</text><text x="38" y="220" font-family="Arial" font-size="17" fill="#223c50">Quantity &amp; packing</text><text x="38" y="260" font-family="Arial" font-size="17" fill="#223c50">Availability &amp; lead time</text><text x="38" y="300" font-family="Arial" font-size="17" fill="#223c50">Freight terms</text><text x="38" y="340" font-family="Arial" font-size="15" fill="#536b7b">Order-specific details</text><rect x="20" y="520" width="380" height="420" rx="12" fill="#fdeeee" stroke="#d99"/><text x="38" y="560" font-family="Arial" font-size="19" font-weight="bold" fill="#7b050f">Not by a catalogue entry</text><text x="38" y="600" font-family="Arial" font-size="17" fill="#223c50">Vehicle fitment</text><text x="38" y="640" font-family="Arial" font-size="17" fill="#223c50">Current stock</text><text x="38" y="680" font-family="Arial" font-size="17" fill="#223c50">Manufacturer authorization</text><text x="38" y="720" font-family="Arial" font-size="17" fill="#223c50">Delivery commitment</text><text x="38" y="770" font-family="Arial" font-size="15" fill="#536b7b">A logo identifies a category only.</text><text x="22" y="1000" font-family="Arial" font-size="15" fill="#536b7b">Confirm before treating as available.</text></svg>
