<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img" aria-label="How to copy a complete part reference without losing identifiers"><rect width="420" height="1010" rx="16" fill="#edf3f8"/><text x="22" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">Keep the complete</text><text x="22" y="74" font-family="Arial" font-size="24" font-weight="bold" fill="#17364c">reference</text><rect x="20" y="100" width="380" height="180" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="138" font-family="Arial" font-size="15" fill="#536b7b">FROM LABEL / RECORD</text><text x="38" y="188" font-family="Arial" font-size="32" font-weight="bold" fill="#17364c">39180 - 2B030</text><text x="38" y="228" font-family="Arial" font-size="16" fill="#076c79">prefix · letters · suffix · version</text><text x="22" y="320" font-family="Arial" font-size="18" fill="#223c50">Drop no segment when copying the reference.</text><rect x="20" y="350" width="380" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="38" y="390" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Two numbers for one item?</text><text x="38" y="428" font-family="Arial" font-size="17" fill="#223c50">Keep both in the enquiry.</text><text x="38" y="458" font-family="Arial" font-size="17" fill="#223c50">Ask for identification review.</text><rect x="20" y="620" width="380" height="250" rx="12" fill="#fdeeee" stroke="#d99"/><text x="38" y="660" font-family="Arial" font-size="20" font-weight="bold" fill="#7b050f">Do not assume interchangeable</text><text x="38" y="698" font-family="Arial" font-size="17" fill="#223c50">Suffixes can change the version.</text><text x="38" y="728" font-family="Arial" font-size="17" fill="#223c50">Wait for confirmation first.</text><text x="22" y="930" font-family="Arial" font-size="15" fill="#536b7b">Keep the reference exactly as printed.</text></svg>
