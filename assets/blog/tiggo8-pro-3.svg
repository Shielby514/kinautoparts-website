<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Reference list is not a live stock feed"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Reference list is not a live stock feed</text><rect x="30" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="46" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">This table shows</text><text x="46" y="158" font-family="Arial" font-size="16" fill="#223c50">Catalogue references</text><text x="46" y="188" font-family="Arial" font-size="16" fill="#223c50">Grouped by category</text><text x="46" y="218" font-family="Arial" font-size="16" fill="#223c50">For enquiry use</text><rect x="325" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="341" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">It does not show</text><text x="341" y="158" font-family="Arial" font-size="16" fill="#223c50">Live availability</text><text x="341" y="188" font-family="Arial" font-size="16" fill="#223c50">Certified fitment</text><text x="341" y="218" font-family="Arial" font-size="16" fill="#223c50">Fixed pricing</text><rect x="620" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="636" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Therefore</text><text x="636" y="158" font-family="Arial" font-size="16" fill="#223c50">Ask before ordering</text><text x="636" y="188" font-family="Arial" font-size="16" fill="#223c50">Confirm each line</text><text x="636" y="218" font-family="Arial" font-size="16" fill="#223c50">Keep replies on file</text><text x="36" y="380" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>