<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="What a quotation confirms and what a catalogue entry does not"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">What is actually confirmed?</text><rect x="30" y="82" width="410" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="50" y="122" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">In the quotation (order-specific)</text><text x="50" y="162" font-family="Arial" font-size="16" fill="#223c50">Proposed item &amp; identification basis</text><text x="50" y="196" font-family="Arial" font-size="16" fill="#223c50">Quantity &amp; packing</text><text x="50" y="230" font-family="Arial" font-size="16" fill="#223c50">Availability &amp; lead time</text><text x="50" y="264" font-family="Arial" font-size="16" fill="#223c50">Freight terms</text><rect x="460" y="82" width="410" height="250" rx="12" fill="#fdeeee" stroke="#d99"/><text x="480" y="122" font-family="Arial" font-size="19" font-weight="bold" fill="#7b050f">Not confirmed by a catalogue entry</text><text x="480" y="162" font-family="Arial" font-size="16" fill="#223c50">Vehicle fitment</text><text x="480" y="196" font-family="Arial" font-size="16" fill="#223c50">Current stock</text><text x="480" y="230" font-family="Arial" font-size="16" fill="#223c50">Manufacturer authorization</text><text x="480" y="264" font-family="Arial" font-size="16" fill="#223c50">Delivery commitment</text><text x="36" y="372" font-family="Arial" font-size="15" fill="#536b7b">A brand logo identifies a category only — it does not establish appointment or affiliation.</text></svg>
