<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">Check that the photographs belong together</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">View A</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Complete component</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Connector and mounts</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">Same visible features</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">View B</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Readable identification</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Enough surrounding item</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">No hidden substitution</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Decision</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Consistent: keep evidence</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Different: flag conflict</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">Unclear: request another</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">A shared filename prefix cannot resolve a visible component mismatch.</text></svg>