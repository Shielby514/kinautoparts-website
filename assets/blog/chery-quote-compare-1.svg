<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Same reference is only the starting point"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Same reference is only the starting point</text><rect x="30" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="46" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Confirm the item</text><text x="46" y="158" font-family="Arial" font-size="16" fill="#223c50">Full OE reference</text><text x="46" y="188" font-family="Arial" font-size="16" fill="#223c50">Include every suffix</text><text x="46" y="218" font-family="Arial" font-size="16" fill="#223c50">Label photograph</text><rect x="325" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="341" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Confirm the variant</text><text x="341" y="158" font-family="Arial" font-size="16" fill="#223c50">Model year</text><text x="341" y="188" font-family="Arial" font-size="16" fill="#223c50">Powertrain / market</text><text x="341" y="218" font-family="Arial" font-size="16" fill="#223c50">Not the name alone</text><rect x="620" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="636" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Then compare</text><text x="636" y="158" font-family="Arial" font-size="16" fill="#223c50">Only like-for-like</text><text x="636" y="188" font-family="Arial" font-size="16" fill="#223c50">Same item + terms</text><text x="636" y="218" font-family="Arial" font-size="16" fill="#223c50">Keep replies on file</text><text x="36" y="380" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>