<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900" role="img" aria-label="How to read this catalogue table"><rect width="420" height="900" rx="20" fill="#edf3f8"/><text x="26" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">How to read this</text><text x="26" y="80" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">catalogue table</text><rect x="24" y="100" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="138" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">1 Reference</text><text x="42" y="174" font-family="Arial" font-size="17" fill="#223c50">Pick one line</text><text x="42" y="206" font-family="Arial" font-size="17" fill="#223c50">Open its detail page</text><text x="42" y="238" font-family="Arial" font-size="17" fill="#223c50">Check the wording</text><rect x="24" y="360" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="398" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">2 Enquiry</text><text x="42" y="434" font-family="Arial" font-size="17" fill="#223c50">One line per item</text><text x="42" y="466" font-family="Arial" font-size="17" fill="#223c50">Add quantity</text><text x="42" y="498" font-family="Arial" font-size="17" fill="#223c50">Attach photos</text><rect x="24" y="620" width="372" height="248" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="658" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">3 Confirmation</text><text x="42" y="694" font-family="Arial" font-size="17" fill="#223c50">Written specification</text><text x="42" y="726" font-family="Arial" font-size="17" fill="#223c50">Lead time and packing</text><text x="42" y="758" font-family="Arial" font-size="17" fill="#223c50">Before placing order</text><text x="26" y="888" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>