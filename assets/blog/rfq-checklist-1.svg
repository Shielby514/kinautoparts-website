<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Four details to send with a Chinese vehicle parts RFQ"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Four details to send with the enquiry</text><rect x="30" y="82" width="200" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">1 · Brand</text><text x="48" y="158" font-family="Arial" font-size="16" fill="#223c50">Vehicle brand</text><text x="48" y="188" font-family="Arial" font-size="16" fill="#223c50">Model variant</text><text x="48" y="218" font-family="Arial" font-size="16" fill="#223c50">Production year</text><rect x="245" y="82" width="200" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="263" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">2 · Reference</text><text x="263" y="158" font-family="Arial" font-size="16" fill="#223c50">Complete OE</text><text x="263" y="188" font-family="Arial" font-size="16" fill="#223c50">Keep suffixes</text><text x="263" y="218" font-family="Arial" font-size="16" fill="#223c50">Keep both if two</text><rect x="460" y="82" width="200" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="478" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">3 · Quantity</text><text x="478" y="158" font-family="Arial" font-size="16" fill="#223c50">Required qty</text><text x="478" y="188" font-family="Arial" font-size="16" fill="#223c50">Unit (pcs/set)</text><text x="478" y="218" font-family="Arial" font-size="16" fill="#223c50">Alternatives apart</text><rect x="675" y="82" width="195" height="250" rx="12" fill="white" stroke="#9db7c7"/><text x="693" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">4 · Destination</text><text x="693" y="158" font-family="Arial" font-size="16" fill="#223c50">Country / port</text><text x="693" y="188" font-family="Arial" font-size="16" fill="#223c50">Part-label photo</text><text x="693" y="218" font-family="Arial" font-size="16" fill="#223c50">If uncertain</text><text x="36" y="378" font-family="Arial" font-size="15" fill="#536b7b">A catalogue result starts the enquiry; it does not confirm fitment or available stock.</text></svg>
