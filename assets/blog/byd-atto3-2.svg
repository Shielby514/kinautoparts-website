<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Four details to compare before approval"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Four details to compare before approval</text><rect x="30" y="82" width="206" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="46" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">1 Reference</text><text x="46" y="158" font-family="Arial" font-size="16" fill="#223c50">OE from original part</text><text x="46" y="188" font-family="Arial" font-size="16" fill="#223c50">Letters + suffixes</text><text x="46" y="218" font-family="Arial" font-size="16" fill="#223c50">No partial numbers</text><rect x="251" y="82" width="206" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="267" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">2 Connector</text><text x="267" y="158" font-family="Arial" font-size="16" fill="#223c50">Plug shape</text><text x="267" y="188" font-family="Arial" font-size="16" fill="#223c50">Pin count</text><text x="267" y="218" font-family="Arial" font-size="16" fill="#223c50">Photo of the face</text><rect x="472" y="82" width="206" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="488" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">3 Mounting</text><text x="488" y="158" font-family="Arial" font-size="16" fill="#223c50">Bracket position</text><text x="488" y="188" font-family="Arial" font-size="16" fill="#223c50">Fixing points</text><text x="488" y="218" font-family="Arial" font-size="16" fill="#223c50">Photo in situ</text><rect x="693" y="82" width="206" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="709" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">4 Dimensions</text><text x="709" y="158" font-family="Arial" font-size="16" fill="#223c50">Measure, do not guess</text><text x="709" y="188" font-family="Arial" font-size="16" fill="#223c50">Record units</text><text x="709" y="218" font-family="Arial" font-size="16" fill="#223c50">Keep a tolerance note</text><text x="36" y="380" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>