<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Ask for a line-by-line quotation reply"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">Ask for a line-by-line quotation reply</text><rect x="30" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="46" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Confirmed</text><text x="46" y="158" font-family="Arial" font-size="16" fill="#223c50">Reference accepted</text><text x="46" y="188" font-family="Arial" font-size="16" fill="#223c50">Evidence on file</text><text x="46" y="218" font-family="Arial" font-size="16" fill="#223c50">Specification stated</text><rect x="325" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="341" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">Alternative</text><text x="341" y="158" font-family="Arial" font-size="16" fill="#223c50">Proposed separately</text><text x="341" y="188" font-family="Arial" font-size="16" fill="#223c50">Needs its own review</text><text x="341" y="218" font-family="Arial" font-size="16" fill="#223c50">Not automatically equal</text><rect x="620" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="636" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">More evidence</text><text x="636" y="158" font-family="Arial" font-size="16" fill="#223c50">What is missing</text><text x="636" y="188" font-family="Arial" font-size="16" fill="#223c50">Who provides it</text><text x="636" y="218" font-family="Arial" font-size="16" fill="#223c50">When it is due</text><text x="36" y="380" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>