<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900" role="img" aria-label="Align four fields before you compare price"><rect width="420" height="900" rx="20" fill="#edf3f8"/><text x="26" y="50" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">Align four fields before</text><text x="26" y="80" font-family="Arial" font-size="22" font-weight="bold" fill="#17364c">you compare price</text><rect x="24" y="100" width="372" height="183" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="138" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">1 Specification</text><text x="42" y="174" font-family="Arial" font-size="17" fill="#223c50">Grade / material</text><text x="42" y="206" font-family="Arial" font-size="17" fill="#223c50">Stated in writing</text><text x="42" y="238" font-family="Arial" font-size="17" fill="#223c50">No silent substitute</text><rect x="24" y="295" width="372" height="183" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="333" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">2 Quantity basis</text><text x="42" y="369" font-family="Arial" font-size="17" fill="#223c50">Packing unit</text><text x="42" y="401" font-family="Arial" font-size="17" fill="#223c50">MOQ per line</text><text x="42" y="433" font-family="Arial" font-size="17" fill="#223c50">Units per carton</text><rect x="24" y="490" width="372" height="183" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="528" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">3 Logistics</text><text x="42" y="564" font-family="Arial" font-size="17" fill="#223c50">Lead time</text><text x="42" y="596" font-family="Arial" font-size="17" fill="#223c50">Freight to destination</text><text x="42" y="628" font-family="Arial" font-size="17" fill="#223c50">Incoterm stated</text><rect x="24" y="685" width="372" height="183" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="42" y="723" font-family="Arial" font-size="19" font-weight="bold" fill="#076c79">4 Terms</text><text x="42" y="759" font-family="Arial" font-size="17" fill="#223c50">Warranty</text><text x="42" y="791" font-family="Arial" font-size="17" fill="#223c50">Documentation</text><text x="42" y="823" font-family="Arial" font-size="17" fill="#223c50">Validity of quote</text><text x="26" y="888" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>