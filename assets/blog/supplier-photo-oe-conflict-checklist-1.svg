<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">Separate three kinds of evidence</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Requested reference</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Keep the full number</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Preserve every suffix</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">Record source and date</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Physical marking</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Read the item itself</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Keep an uncropped view</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">Flag unreadable text</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Packaging label</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Record the full label</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Show the item beside it</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">Do not assume contents</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">A filename connects files; it does not prove part identity.</text></svg>