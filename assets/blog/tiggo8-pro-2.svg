<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="How to read this catalogue table"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="50" font-family="Arial" font-size="26" font-weight="bold" fill="#17364c">How to read this catalogue table</text><rect x="30" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="46" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">1 Reference</text><text x="46" y="158" font-family="Arial" font-size="16" fill="#223c50">Pick one line</text><text x="46" y="188" font-family="Arial" font-size="16" fill="#223c50">Open its detail page</text><text x="46" y="218" font-family="Arial" font-size="16" fill="#223c50">Check the wording</text><rect x="325" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="341" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">2 Enquiry</text><text x="341" y="158" font-family="Arial" font-size="16" fill="#223c50">One line per item</text><text x="341" y="188" font-family="Arial" font-size="16" fill="#223c50">Add quantity</text><text x="341" y="218" font-family="Arial" font-size="16" fill="#223c50">Attach photos</text><rect x="620" y="82" width="280" height="250" rx="12" fill="#ffffff" stroke="#9db7c7"/><text x="636" y="120" font-family="Arial" font-size="18" font-weight="bold" fill="#076c79">3 Confirmation</text><text x="636" y="158" font-family="Arial" font-size="16" fill="#223c50">Written specification</text><text x="636" y="188" font-family="Arial" font-size="16" fill="#223c50">Lead time and packing</text><text x="636" y="218" font-family="Arial" font-size="16" fill="#223c50">Before placing order</text><text x="36" y="380" font-family="Arial" font-size="13" fill="#344d60">Editorial diagram | not fitment or stock evidence.</text></svg>