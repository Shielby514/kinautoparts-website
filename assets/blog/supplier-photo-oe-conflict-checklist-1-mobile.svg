<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1010" role="img"><rect width="420" height="1010" rx="16" fill="#edf3f8"/><text x="22" y="35" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">Separate three kinds of</text><text x="22" y="63" font-family="Arial" font-size="23" font-weight="bold" fill="#17364c">evidence</text><rect x="20" y="125" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="167" font-family="Arial" font-size="22" fill="#076c79">Requested reference</text><text x="40" y="210" font-family="Arial" font-size="20" fill="#076c79">Keep the full number</text><text x="40" y="253" font-family="Arial" font-size="20" fill="#076c79">Preserve every suffix</text><text x="40" y="296" font-family="Arial" font-size="20" fill="#076c79">Record source and date</text><rect x="20" y="370" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="412" font-family="Arial" font-size="22" fill="#076c79">Physical marking</text><text x="40" y="455" font-family="Arial" font-size="20" fill="#076c79">Read the item itself</text><text x="40" y="498" font-family="Arial" font-size="20" fill="#076c79">Keep an uncropped view</text><text x="40" y="541" font-family="Arial" font-size="20" fill="#076c79">Flag unreadable text</text><rect x="20" y="615" width="380" height="220" rx="12" fill="white" stroke="#9db7c7"/><text x="40" y="657" font-family="Arial" font-size="22" fill="#076c79">Packaging label</text><text x="40" y="700" font-family="Arial" font-size="20" fill="#076c79">Record the full label</text><text x="40" y="743" font-family="Arial" font-size="20" fill="#076c79">Show the item beside it</text><text x="40" y="786" font-family="Arial" font-size="20" fill="#076c79">Do not assume contents</text><text x="22" y="905" font-family="Arial" font-size="19" fill="#344d60">A filename connects files; it does</text><text x="22" y="933" font-family="Arial" font-size="19" fill="#344d60">not prove part identity.</text></svg>