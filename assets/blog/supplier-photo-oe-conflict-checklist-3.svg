<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><rect width="900" height="420" rx="20" fill="#edf3f8"/><text x="36" y="48" font-family="Arial" font-size="25" font-weight="bold" fill="#17364c">Resolve a conflict before approving an alternative</text><rect x="30" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="48" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Original request</text><text x="48" y="168" font-family="Arial" font-size="18" fill="#223c50">Keep the original row</text><text x="48" y="204" font-family="Arial" font-size="18" fill="#223c50">Retain quantity and unit</text><text x="48" y="240" font-family="Arial" font-size="18" fill="#223c50">Add an unresolved flag</text><rect x="320" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="338" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Supplier response</text><text x="338" y="168" font-family="Arial" font-size="18" fill="#223c50">Proposed full reference</text><text x="338" y="204" font-family="Arial" font-size="18" fill="#223c50">Matching photo evidence</text><text x="338" y="240" font-family="Arial" font-size="18" fill="#223c50">Basis for any alternative</text><rect x="610" y="85" width="270" height="240" rx="12" fill="white" stroke="#9db7c7"/><text x="628" y="124" font-family="Arial" font-size="20" font-weight="bold" fill="#076c79">Buyer review</text><text x="628" y="168" font-family="Arial" font-size="18" fill="#223c50">Identity still uncertain?</text><text x="628" y="204" font-family="Arial" font-size="18" fill="#223c50">Keep line unresolved</text><text x="628" y="240" font-family="Arial" font-size="18" fill="#223c50">Approve only confirmed</text><text x="36" y="370" font-family="Arial" font-size="18" fill="#344d60">A quotation proposal is not automatic interchangeability confirmation.</text></svg>